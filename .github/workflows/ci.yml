name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse Python sources
        run: python -m compileall -q Code/qgai
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
